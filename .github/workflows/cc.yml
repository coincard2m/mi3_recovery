name: Build Standard Mi3 Initramfs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cai dat moi truong build
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -yqq build-essential libncurses5-dev gawk git subversion libssl-dev gettext \
            unzip zlib1g-dev file wget python3 rsync
          sudo apt-get clean

      - name: Keo ma nguon va Config chuan cua XFY9326
        run: |
          # 1. Clone OpenWrt 21.02.0 chuan
          git clone -b v21.02.0 --single-branch https://github.com/openwrt/openwrt.git openwrt
          
          # 2. Clone repo XFY9326 de lay nguyen bo Patches va Config da kiem chung
          git clone --depth 1 https://github.com/XFY9326/Xiaomi-R3-OpenWrt-Stable.git r3_src
          cp -r r3_src/patches/* openwrt/
          cp r3_src/.config openwrt/.config
          rm -rf r3_src

      - name: Cap nhat Feeds va Bat Initramfs
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # Su dung cong cu config chuan cua OpenWrt de khong bao gio bi gay dependency
          ./scripts/config --enable CONFIG_TARGET_ROOTFS_INITRAMFS
          make defconfig

      - name: Chen System Files cuu ho (Khong dung cham ma nguon)
        run: |
          cd openwrt
          mkdir -p files/etc/config files/usr/sbin
          
          # Dat mat khau root mac dinh
          echo 'root:$1$wOSEP9x2$zP86p7aWkM0dK7uF.qS0X/:19000:0:99999:7:::' > files/etc/shadow
          
          # Chep script cfg_manager
          cat << 'EOF' > files/usr/sbin/cfg_manager
          #!/bin/sh
          REC_DEV=$(grep -E '"(firmware|OS1|recovery)"' /proc/mtd | head -n1 | cut -d: -f1)
          [ -z "$REC_DEV" ] && exit 1
          MTD_PATH="/dev/${REC_DEV}"
          CANDIDATE_BLOCKS="31 30 29 28"

          case "$1" in
              save)
                  cd /
                  tar -czf /tmp/cfg_payload.tar.gz etc/config/wireless etc/config/network etc/shadow 2>/dev/null
                  SAVED=0
                  for BLK in $CANDIDATE_BLOCKS; do
                      if dd if=/tmp/cfg_payload.tar.gz of=$MTD_PATH bs=128k seek=$BLK count=1 conv=sync 2>/dev/null; then
                          dd if=$MTD_PATH of=/tmp/cfg_verify.tar.gz bs=128k skip=$BLK count=1 2>/dev/null
                          if tar -tzf /tmp/cfg_verify.tar.gz >/dev/null 2>&1; then
                              rm -f /tmp/cfg_verify.tar.gz
                              SAVED=1
                              break
                          fi
                          rm -f /tmp/cfg_verify.tar.gz
                      fi
                  done
                  rm -f /tmp/cfg_payload.tar.gz
                  [ $SAVED -eq 1 ] && exit 0 || exit 1
                  ;;
              load)
                  for BLK in $CANDIDATE_BLOCKS; do
                      dd if=$MTD_PATH of=/tmp/cfg_read.tar.gz bs=128k skip=$BLK count=1 2>/dev/null
                      if tar -tzf /tmp/cfg_read.tar.gz >/dev/null 2>&1; then
                          tar -xzf /tmp/cfg_read.tar.gz -C /
                          rm -f /tmp/cfg_read.tar.gz
                          wifi reload 2>/dev/null
                          exit 0
                      fi
                      rm -f /tmp/cfg_read.tar.gz
                  done
                  ;;
              reset)
                  for BLK in $CANDIDATE_BLOCKS; do
                      dd if=/dev/zero of=$MTD_PATH bs=128k seek=$BLK count=1 conv=sync 2>/dev/null
                  done
                  sync
                  reboot
                  ;;
          esac
          EOF
          chmod +x files/usr/sbin/cfg_manager
          chmod 600 files/etc/shadow

      - name: Bien dich Firmware
        run: |
          cd openwrt
          # Compile voi so luong luong chuan, tu dong bat log chi tiet neu gap su co
          make -j$(nproc) || make -j1 V=s

      # Giu nguyen terminal neu co van de de khong ton thoi gian chay lai
      - name: Debug SSH truc tiep (Neu xay ra loi)
        if: failure()
        uses: mxschmitt/action-tmate@v3
        with:
          detached: false

      - name: Luu Recovery Kernel Initramfs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mi3_Initramfs_Kernel
          path: openwrt/bin/targets/ramips/mt7620/*initramfs-kernel.bin
