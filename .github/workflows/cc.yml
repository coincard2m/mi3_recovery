name: Build and Release Toolchain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cai dat moi truong
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -yqq build-essential libncurses5-dev gawk git subversion libssl-dev gettext \
            unzip zlib1g-dev file wget python3 rsync zstd
          sudo apt-get clean

      - name: Clone Lean OpenWrt
        run: |
          git clone --depth 1 https://github.com/coolsnowwolf/lede openwrt
          cd openwrt
          rm -rf package/feeds feeds.conf.default
          touch feeds.conf.default
          rm -rf package/lean
          rm -rf package/libs/libselinux package/libs/libsepol package/network/utils/iwinfo package/utils/policycoreutils

      - name: Cau hinh Minimal
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7620=y
          CONFIG_TARGET_ramips_mt7620_DEVICE_xiaomi_miwifi-3=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          # CONFIG_TARGET_ROOTFS_SQUASHFS is not set

          # Cong cu he thong & mang co ban
          CONFIG_PACKAGE_mtd=y
          CONFIG_PACKAGE_busybox=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_kmod-mt76=y
          CONFIG_PACKAGE_wpad-basic-wolfssl=y

          # Tat sach firewall, ppp de giam kich thuoc kernel initramfs xuong duoi 3MB
          # CONFIG_PACKAGE_firewall is not set
          # CONFIG_PACKAGE_ppp is not set
          # CONFIG_PACKAGE_dnsmasq is not set
          # CONFIG_PACKAGE_dnsmasq-full is not set
          CONFIG_PACKAGE_kmod-ipt-core=n
          CONFIG_PACKAGE_kmod-ipt-nat=n
          CONFIG_PACKAGE_kmod-ipt-nat6=n
          CONFIG_PACKAGE_kmod-nf-nathelper-extra=n
          CONFIG_PACKAGE_kmod-ipv6=n
          CONFIG_PACKAGE_kmod-usb-core=n
          CONFIG_PACKAGE_kmod-usb2=n
          CONFIG_PACKAGE_kmod-usb-ohci=n
          EOF
          make defconfig

      - name: Bien dich Firmware va Kernel
        run: |
          cd openwrt
          echo "=== TIEN HANH BIEN DICH ==="
          make -j$(nproc) || {
              echo "=== LOI XAY RA: IN CHI TIET TAI TARGET IMAGE ==="
              make target/install V=s -j1 || true
              exit 1
          }

      - name: Dong goi Toolchain va Artifacts
        run: |
          # Nén toàn bộ những gì đã compile để lưu vĩnh viễn
          tar -I 'zstd -T0 -1' -cf mi3_toolchain_cache.tar.zst \
            openwrt/staging_dir \
            openwrt/build_dir/toolchain-* \
            openwrt/build_dir/target-*

      - name: Day file len GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: toolchain-v1
          name: "Mi3 Toolchain & Build Artifacts"
          body: "Bản build thành công cho Xiaomi Mi WiFi 3."
          draft: false
          prerelease: false
          files: |
            mi3_toolchain_cache.tar.zst
            openwrt/bin/targets/ramips/mt7620/*initramfs-kernel.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
