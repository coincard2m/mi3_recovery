name: Build Mi3 Rescue PoC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cai dat moi truong build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk git subversion libssl-dev u-boot-tools file wget libelf-dev zlib1g-dev flex bison autoconf

      - name: Lay source Padavan va Toolchain
        run: |
          git clone --depth=1 https://github.com/hanwckf/rt-n56u.git ~/rt-n56u
          cd ~/rt-n56u/toolchain-mipsel
          sh dl_toolchain.sh

      - name: Build Dropbear Static tu nguon Dropbear
        run: |
          export PATH="$HOME/rt-n56u/toolchain-mipsel/toolchain-3.4.x/bin:$PATH"
          git clone --depth=1 https://github.com/mkj/dropbear.git ~/dropbear_src
          cd ~/dropbear_src
          autoconf
          autoheader
          ./configure \
            --host=mipsel-linux-uclibc \
            --disable-zlib \
            --disable-syslog \
            --disable-lastlog \
            --disable-utmp \
            --disable-wtmp \
            CC=mipsel-linux-uclibc-gcc \
            LDFLAGS="-static"
          make -j$(nproc) PROGRAMS="dropbear dropbearkey" MULTI=0

      - name: Build Busybox Static tu nguon chinh thuc
        run: |
          export PATH="$HOME/rt-n56u/toolchain-mipsel/toolchain-3.4.x/bin:$PATH"
          # Clone truc tiep ma nguon BusyBox on dinh tu official mirror
          git clone --depth=1 --branch 1_36_stable git://busybox.net/busybox.git ~/busybox_src
          cd ~/busybox_src

          # Tao config mac dinh
          make ARCH=mips defconfig

          # Bat CONFIG_STATIC va tat cac module mang de xung dot voi uClibc
          scripts/config --enable CONFIG_STATIC
          scripts/config --disable CONFIG_FEATURE_NSLOOKUP_BIG
          scripts/config --disable CONFIG_FEATURE_INETD_RPC

          # Bien dich va cai dat ra mot thu muc rieng
          make -j$(nproc) ARCH=mips CROSS_COMPILE=mipsel-linux-uclibc-
          make ARCH=mips CROSS_COMPILE=mipsel-linux-uclibc- CONFIG_PREFIX=~/initramfs_root install

      - name: Chuan bi Initramfs Rootfs
        run: |
          mkdir -p ~/initramfs_root/{bin,sbin,usr/bin,usr/sbin,dev,proc,sys,etc,mnt,tmp,var,root}

          # Copy script khoi dong va config wifi
          cp init ~/initramfs_root/init
          chmod +x ~/initramfs_root/init
          cp RT2860_default_v24.dat ~/initramfs_root/RT2860_default_v24.dat

          # Copy Dropbear static vao Initramfs
          cp ~/dropbear_src/dropbear ~/initramfs_root/usr/sbin/
          cp ~/dropbear_src/dropbearkey ~/initramfs_root/usr/bin/
          chmod +x ~/initramfs_root/usr/sbin/dropbear ~/initramfs_root/usr/bin/dropbearkey

      - name: Compile Kernel va tao uImage Recovery
        run: |
          export PATH="$HOME/rt-n56u/toolchain-mipsel/toolchain-3.4.x/bin:$PATH"
          cd ~/rt-n56u/trunk/linux-3.4.x

          # Su dung cau hinh kernel mac dinh
          cp arch/mips/configs/rt-n56u_defconfig .config 2>/dev/null || make defconfig ARCH=mips

          # Tich hop initramfs truc tiep vao Kernel
          scripts/config --enable CONFIG_BLK_DEV_INITRD
          scripts/config --set-str CONFIG_INITRAMFS_SOURCE "$HOME/initramfs_root"
          scripts/config --set-val CONFIG_INITRAMFS_ROOT_UID 0
          scripts/config --set-val CONFIG_INITRAMFS_ROOT_GID 0

          # Bat driver mang day va driver Wi-Fi noi bo MT7620
          scripts/config --enable CONFIG_RAETH
          scripts/config --enable CONFIG_RT2860V2_AP

          # Compile kernel vmlinux
          make -j$(nproc) ARCH=mips CROSS_COMPILE=mipsel-linux-uclibc- vmlinux

          # Dong goi thanh uImage
          mipsel-linux-uclibc-objcopy -O binary -S vmlinux ~/vmlinux.bin
          lzma -9 -f -k ~/vmlinux.bin
          mkimage -A mips -O linux -T kernel -C lzma \
            -a 0x80000000 -e 0x80000000 \
            -n "Mi3_Recovery_PoC" \
            -d ~/vmlinux.bin.lzma $GITHUB_WORKSPACE/uImage_recovery

      - name: Luu tru artifact uImage_recovery
        uses: actions/upload-artifact@v4
        with:
          name: uImage_recovery
          path: uImage_recovery
