name: Build Mi R3 Recovery Kernel

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Chuẩn bị môi trường build
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget zstd

      - name: Tải OpenWrt Image Builder MT7620
        run: |
          # Kéo bản Image Builder MT7620 chính thức
          wget -q https://downloads.openwrt.org/releases/23.05.5/targets/ramips/mt7620/openwrt-imagebuilder-23.05.5-ramips-mt7620.Linux-x86_64.tar.zst
          tar -I zstd -xf openwrt-imagebuilder-*.tar.zst
          mv openwrt-imagebuilder-* builder

      - name: Tạo cấu hình mạng & Wi-Fi mặc định
        run: |
          cd builder
          mkdir -p files/etc/uci-defaults

          # Script tự động cấu hình khi kernel boot trên RAM
          cat << 'EOF' > files/etc/uci-defaults/99-init-settings
          # 1. Bật giao diện LAN (cổng mạng dây)
          uci set network.lan.ipaddr='192.168.1.1'
          uci set network.lan.netmask='255.255.255.0'
          uci commit network

          # 2. Bật radio 2.4GHz & Đặt tên SSID + Pass WPA2
          uci set wireless.@wifi-device[0].disabled='0'
          uci set wireless.default_radio0.ssid='Mi-R3 recovery'
          uci set wireless.default_radio0.encryption='psk2'
          uci set wireless.default_radio0.key='1234567890'
          uci commit wireless

          # 3. Kích hoạt dịch vụ
          /etc/init.d/network restart
          wifi
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-init-settings

      - name: SSH trực tiếp vào máy GitHub (Tmate)
        uses: mxschmitt/action-tmate@v3
        # Bước này sẽ dừng lại và in ra link SSH để bạn điều khiển terminal trực tiếp
