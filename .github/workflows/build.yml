name: Build Mi3 TWRP Super Minimal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cai dat moi truong build
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -yqq build-essential libncurses5-dev gawk git subversion libssl-dev gettext \
            unzip zlib1g-dev file wget python3 rsync
          sudo apt-get clean

      - name: Clone Lean OpenWrt Source
        run: |
          git clone --depth 1 https://github.com/coolsnowwolf/lede openwrt
          cd openwrt
          # XOA SAC TOAN BO FEEDS NGOAI - Khong de bat cu package rac nao lot vao
          rm -rf package/feeds feeds.conf.default
          touch feeds.conf.default

          # Xoa chu dong tat ca cac thu muc co nguy co loi SELinux va iwinfo
          rm -rf package/libs/libselinux package/libs/libsepol package/network/utils/iwinfo package/utils/policycoreutils

      - name: Khoi phuc Cache Toolchain (Neu co)
        uses: actions/cache/restore@v4
        id: cache-toolchain
        with:
          path: |
            openwrt/staging_dir
            openwrt/build_dir/toolchain-*
          key: mi3-clean-toolchain-v2
          restore-keys: |
            mi3-clean-toolchain-

      - name: Cau hinh toi gian tuyet doi (Khong Feeds, Initramfs Only)
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7620=y
          CONFIG_TARGET_ramips_mt7620_DEVICE_xiaomi_miwifi-3=y

          # Chi build Initramfs chay tren RAM
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          # CONFIG_TARGET_ROOTFS_SQUASHFS is not set

          # Cong cu co san trong core OpenWrt
          CONFIG_PACKAGE_mtd=y
          CONFIG_PACKAGE_busybox=y

          # Tat sach cac goi rac
          # CONFIG_PACKAGE_libselinux is not set
          # CONFIG_PACKAGE_libsepol is not set
          # CONFIG_PACKAGE_iwinfo is not set
          # CONFIG_PACKAGE_libiwinfo is not set
          # CONFIG_PACKAGE_luci is not set
          # CONFIG_PACKAGE_dnsmasq is not set
          # CONFIG_PACKAGE_firewall is not set
          # CONFIG_PACKAGE_ppp is not set
          # CONFIG_PACKAGE_kmod-ipv6 is not set
          EOF
          make defconfig

      - name: Bien dich Toolchain (Xay dung bo cong cu cot loi)
        run: |
          cd openwrt
          make toolchain/compile -j$(nproc) || make toolchain/compile -j1 V=s

      # BUOC QUAN TRONG: Luu cache Toolchain NGAY LAP TUC, ke ca cac buoc sau co loi van luu!
      - name: Luu Cache Toolchain Du Phong
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            openwrt/staging_dir
            openwrt/build_dir/toolchain-*
          key: mi3-clean-toolchain-v2

      - name: Cai dat Web UI, LED, Reset & Script 3.5MB
        run: |
          cd openwrt
          mkdir -p files/etc/config files/etc/hotplug.d/button files/usr/sbin files/www/cgi-bin

          # LAN 192.168.1.1
          cat << 'EOF' > files/etc/config/network
          config interface 'loopback'
                  option device 'lo'
                  option proto 'static'
                  option ipaddr '127.0.0.1'
                  option netmask '255.0.0.0'

          config interface 'lan'
                  option device 'br-lan'
                  option proto 'static'
                  option ipaddr '192.168.1.1'
                  option netmask '255.255.255.0'
          EOF

          # Wi-Fi Mac Dinh
          cat << 'EOF' > files/etc/config/wireless
          config wifi-device 'radio0'
                  option type 'mac80211'
                  option path '10180000.wmac'
                  option channel '6'
                  option band '2g'
                  option htmode 'HT40'
                  option disabled '0'

          config wifi-iface 'default_radio0'
                  option device 'radio0'
                  option network 'lan'
                  option mode 'ap'
                  option ssid 'Mi3_recovery'
                  option encryption 'psk2'
                  option key '1234567890'
          EOF

          # cfg_manager offset 3.5MB
          cat << 'EOF' > files/usr/sbin/cfg_manager
          #!/bin/sh
          REC_DEV=$(grep -E '"(firmware|OS1|recovery)"' /proc/mtd | head -n1 | cut -d: -f1)
          [ -z "$REC_DEV" ] && exit 1
          MTD_PATH="/dev/${REC_DEV}"

          case "$1" in
              save)
                  cd /etc/config
                  tar -czf /tmp/backup_cfg.tar.gz wireless network 2>/dev/null
                  dd if=/tmp/backup_cfg.tar.gz of=$MTD_PATH bs=64k seek=56 conv=sync 2>/dev/null
                  rm -f /tmp/backup_cfg.tar.gz
                  ;;
              load)
                  dd if=$MTD_PATH of=/tmp/restore_cfg.tar.gz bs=64k skip=56 count=2 2>/dev/null
                  if tar -tzf /tmp/restore_cfg.tar.gz >/dev/null 2>&1; then
                      tar -xzf /tmp/restore_cfg.tar.gz -C /etc/config/
                      wifi reload 2>/dev/null
                  fi
                  rm -f /tmp/restore_cfg.tar.gz
                  ;;
              reset)
                  dd if=/dev/zero of=$MTD_PATH bs=64k seek=56 count=2 conv=sync 2>/dev/null
                  sync
                  reboot
                  ;;
          esac
          EOF
          chmod +x files/usr/sbin/cfg_manager

          # Breathing LED Boot (Dung HTTP server tich hop cua Busybox: httpd)
          cat << 'EOF' > files/etc/rc.local
          for led in /sys/class/leds/*; do
              echo none > "$led/trigger" 2>/dev/null
              echo 0 > "$led/brightness" 2>/dev/null
          done
          for led in /sys/class/leds/*yellow* /sys/class/leds/*orange* /sys/class/leds/*amber*; do
              if [ -d "$led" ]; then
                  echo timer > "$led/trigger" 2>/dev/null
                  echo 1000 > "$led/delay_on" 2>/dev/null
                  echo 1000 > "$led/delay_off" 2>/dev/null
                  break
              fi
          done
          /usr/sbin/cfg_manager load &
          # Chay Web Server tich hop san trong Busybox (khong can package ngoai)
          httpd -p 80 -h /www
          exit 0
          EOF

          # Triple Reset
          cat << 'EOF' > files/etc/hotplug.d/button/00-triple-reset
          #!/bin/sh
          [ "$BUTTON" = "reset" ] || exit 0
          [ "$ACTION" = "released" ] || exit 0
          COUNTER="/tmp/reset_cnt"
          TIME_F="/tmp/reset_time"
          NOW=$(cut -d. -f1 /proc/uptime)
          LAST=0; CNT=0
          [ -f "$TIME_F" ] && LAST=$(cat "$TIME_F")
          [ -f "$COUNTER" ] && CNT=$(cat "$COUNTER")
          if [ $((NOW - LAST)) -le 1 ]; then
              CNT=$((CNT + 1))
          else
              CNT=1
          fi
          echo "$NOW" > "$TIME_F"
          echo "$CNT" > "$COUNTER"
          if [ "$CNT" -ge 3 ]; then
              rm -f "$COUNTER" "$TIME_F"
              for led in /sys/class/leds/*; do
                  echo timer > "$led/trigger" 2>/dev/null
                  echo 80 > "$led/delay_on" 2>/dev/null
                  echo 80 > "$led/delay_off" 2>/dev/null
              done
              /usr/sbin/cfg_manager reset
          fi
          EOF

          # Web UI & CGI
          cat << 'EOF' > files/www/index.html
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mi3 TWRP</title>
          <style>body{font-family:sans-serif;background:#eceff1;padding:15px;}.c{background:#fff;padding:15px;border-radius:8px;max-width:400px;margin:0 auto 15px;}input,button{width:100%;padding:10px;margin:8px 0;box-sizing:border-box;}button{background:#1976d2;color:#fff;border:none;border-radius:4px;font-weight:bold;cursor:pointer;}.d{background:#d32f2f;}</style></head>
          <body>
          <div class="c"><h3>Cài đặt ROM Offline</h3><input type="file" id="f"><button onclick="flash()">Bắt đầu Flash</button><div id="m1"></div></div>
          <div class="c"><h3>Cấu hình Wi-Fi</h3><input type="text" id="s" value="Mi3_recovery"><input type="password" id="p" value="1234567890"><button onclick="setWifi()">Lưu cấu hình</button><div id="m2"></div></div>
          <div class="c"><h3>Khôi phục gốc</h3><button class="d" onclick="rst()">Xóa cài đặt (Reset)</button></div>
          <script>
          async function flash(){let f=document.getElementById('f').files[0];if(!f)return alert('Chọn ROM!');document.getElementById('m1').innerText='Đang nạp ROM...';let r=await fetch('/cgi-bin/flash.cgi',{method:'POST',body:f});document.getElementById('m1').innerText=await r.text();}
          async function setWifi(){let s=document.getElementById('s').value,p=document.getElementById('p').value;if(p.length<8)return alert('Mật khẩu >= 8 ký tự');document.getElementById('m2').innerText='Đang đổi Wi-Fi...';let r=await fetch('/cgi-bin/wifi.cgi',{method:'POST',body:JSON.stringify({ssid:s,pass:p})});document.getElementById('m2').innerText=await r.text();}
          async function rst(){if(confirm('Khôi phục mặc định?')){await fetch('/cgi-bin/reset.cgi');alert('Router đang khởi động lại!');}}
          </script></body></html>
          EOF

          cat << 'EOF' > files/www/cgi-bin/flash.cgi
          #!/bin/sh
          echo -e "Content-type: text/plain\r\n\r\n"
          cat > /tmp/firmware.bin
          [ -s /tmp/firmware.bin ] && { mtd -r write /tmp/firmware.bin firmware >/dev/null 2>&1 & echo "Đang ghi NAND, router sẽ tự reboot!"; } || echo "Lỗi file!"
          EOF

          cat << 'EOF' > files/www/cgi-bin/wifi.cgi
          #!/bin/sh
          echo -e "Content-type: text/plain\r\n\r\n"
          read -r B; S=$(echo "$B" | sed -n 's/.*"ssid":"\([^"]*\)".*/\1/p'); P=$(echo "$B" | sed -n 's/.*"pass":"\([^"]*\)".*/\1/p')
          if [ -n "$S" ] && [ -n "$P" ]; then
              uci set wireless.default_radio0.ssid="$S"
              uci set wireless.default_radio0.key="$P"
              uci commit wireless; wifi reload; /usr/sbin/cfg_manager save
              echo "Đã đổi Wi-Fi thành công!"
          else echo "Lỗi tham số!"; fi
          EOF

          cat << 'EOF' > files/www/cgi-bin/reset.cgi
          #!/bin/sh
          echo -e "Content-type: text/plain\r\n\r\nOK"
          /usr/sbin/cfg_manager reset &
          EOF

          chmod +x files/www/cgi-bin/* files/etc/rc.local

      - name: Bien dich Firmware (Initramfs Kernel)
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Luu Artifacts (File Recovery Kernel)
        uses: actions/upload-artifact@v4
        with:
          name: Mi3_TWRP_Recovery
          path: openwrt/bin/targets/ramips/mt7620/*initramfs-kernel.bin
