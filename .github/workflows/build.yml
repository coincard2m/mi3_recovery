name: Build Mi R3 Recovery Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Chuẩn bị môi trường build
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget xz-utils

      - name: Tải OpenWrt Image Builder MT7620
        run: |
          # Kéo đúng link file tar.xz từ ảnh
          wget -q https://downloads.openwrt.org/releases/23.05.5/targets/ramips/mt7620/openwrt-imagebuilder-23.05.5-ramips-mt7620.Linux-x86_64.tar.xz
          tar -xf openwrt-imagebuilder-*.tar.xz
          mv openwrt-imagebuilder-* builder

      - name: Tạo cấu hình mặc định (LAN + Wi-Fi có mật khẩu)
        run: |
          cd builder
          mkdir -p files/etc/uci-defaults

          cat << 'EOF' > files/etc/uci-defaults/99-init-settings
          # Nhận IP LAN 192.168.1.1
          uci set network.lan.ipaddr='192.168.1.1'
          uci set network.lan.netmask='255.255.255.0'
          uci commit network

          # Bật Wi-Fi 2.4GHz: Tên "Mi-R3 recovery", pass "1234567890"
          uci set wireless.@wifi-device[0].disabled='0'
          uci set wireless.default_radio0.ssid='Mi-R3 recovery'
          uci set wireless.default_radio0.encryption='psk2'
          uci set wireless.default_radio0.key='1234567890'
          uci commit wireless

          /etc/init.d/network restart
          wifi
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-init-settings

      - name: Kết nối SSH máy ảo qua Tmate
        uses: mxschmitt/action-tmate@v3
